services:
  db:
    image: postgres:16
    container_name: autoria_db
    environment:
      POSTGRES_DB: autoria
      POSTGRES_USER: autoria
      POSTGRES_PASSWORD: autoria
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
